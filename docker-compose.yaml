name: angazia

x-common-env: &common-env
  TZ: Africa/Nairobi
  ENVIRONMENT: "${ENVIRONMENT:-development}"
  PORT: "3000"
  CORS_ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS:-*}"
  VERSION: "${VERSION:-1.0.0}"

  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: "${DB_USER:-angazia}"
  DB_PASSWORD: "${DB_PASSWORD:-angazia_dev}"
  DB_NAME: "${DB_NAME:-angazia}"
  DB_SSL_MODE: disable

  JWT_SECRET: "${JWT_SECRET:-change-me-in-production}"
  JWT_EXPIRY_HOURS: "${JWT_EXPIRY_HOURS:-24}"

  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ""
  REDIS_DB: "0"

  ELASTICSEARCH_URL: "${ELASTICSEARCH_URL:-http://elasticsearch:9200}"
  ELASTICSEARCH_USERNAME: "${ELASTICSEARCH_USERNAME:-}"
  ELASTICSEARCH_PASSWORD: "${ELASTICSEARCH_PASSWORD:-}"

  EMAIL_PROVIDER: "${EMAIL_PROVIDER:-smtp}"
  SMTP_HOST: "${SMTP_HOST:-smtp.gmail.com}"
  SMTP_PORT: "${SMTP_PORT:-587}"
  SMTP_USER: "${SMTP_USER:-}"
  SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
  SMTP_FROM_NAME: "${SMTP_FROM_NAME:-Angazia}"
  SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL:-}"
  SENDGRID_API_KEY: "${SENDGRID_API_KEY:-}"
  RESEND_API_KEY: "${RESEND_API_KEY:-}"

  GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
  GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
  GITHUB_REDIRECT_URL: "${GITHUB_REDIRECT_URL:-http://localhost:3000/auth/github/callback}"

  OPENAI_API_KEY: "${OPENAI_API_KEY:-}"

  APP_NAME: "${APP_NAME:-Angazia}"
  APP_URL: "${APP_URL:-http://localhost:3000}"
  APP_DOMAIN: "${APP_DOMAIN:-localhost}"
  PAGE_SIZE: "${PAGE_SIZE:-20}"
  MAX_JOB_POSTS: "${MAX_JOB_POSTS:-3}"
  ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@angazia.com}"

  TWOFA_ENCRYPTION_KEY: "${TWOFA_ENCRYPTION_KEY:-}"

  SMS_PROVIDER: "${SMS_PROVIDER:-mock}"
  AFRICA_TALKING_API_KEY: "${AFRICA_TALKING_API_KEY:-}"
  AFRICA_TALKING_USERNAME: "${AFRICA_TALKING_USERNAME:-}"
  AFRICA_TALKING_FROM: "${AFRICA_TALKING_FROM:-}"
  TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID:-}"
  TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN:-}"
  TWILIO_FROM_NUMBER: "${TWILIO_FROM_NUMBER:-}"
  VONAGE_API_KEY: "${VONAGE_API_KEY:-}"
  VONAGE_API_SECRET: "${VONAGE_API_SECRET:-}"
  VONAGE_FROM: "${VONAGE_FROM:-}"

  INTASEND_API_KEY: "${INTASEND_API_KEY:-}"
  INTASEND_API_SECRET: "${INTASEND_API_SECRET:-}"
  INTASEND_PUBLISHABLE_KEY: "${INTASEND_PUBLISHABLE_KEY:-}"

x-restart: &restart unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    restart: *restart
    environment:
      POSTGRES_USER: "${DB_USER:-angazia}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-angazia_dev}"
      POSTGRES_DB: "${DB_NAME:-angazia}"
      TZ: Africa/Nairobi
    ports:
      - "${DB_EXTERNAL_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-angazia}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: *restart
    ports:
      - "${REDIS_EXTERNAL_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  elasticsearch:
    image: elasticsearch:8.12.2
    restart: *restart
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      TZ: Africa/Nairobi
    ports:
      - "${ES_EXTERNAL_PORT:-9200}:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: angazia/api:latest
    restart: *restart
    environment:
      <<: *common-env
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - webdata:/var/www/web
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  syncer:
    build:
      context: .
      dockerfile: Dockerfile
    image: angazia/syncer:latest
    restart: *restart
    entrypoint: ["syncer"]
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_started

  indexer:
    build:
      context: .
      dockerfile: Dockerfile
    image: angazia/indexer:latest
    restart: "no"
    entrypoint: ["indexer"]
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_started

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  esdata:
    driver: local
  webdata:
    driver: local

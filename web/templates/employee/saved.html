{{/* Employee Saved Jobs Page */}}
<div class="emp-dash">
  <div class="emp-page-head">
    <div>
      <h1 class="emp-page-title">Saved Jobs</h1>
      <p class="emp-page-sub">Positions you've bookmarked</p>
    </div>
  </div>

  <div id="saved-loading" class="emp-loading" style="display: flex;">
    <div class="emp-spinner"></div>
    <p>Loading saved jobs...</p>
  </div>

  <div id="saved-error" class="emp-error" style="display: none;">
    <div class="emp-error-icon">⚠️</div>
    <h3>Failed to load saved jobs</h3>
    <p id="saved-error-msg"></p>
    <button class="emp-btn emp-btn-primary" onclick="location.reload()">Try Again</button>
  </div>

  <div id="saved-content" style="display: none;">
    <div id="saved-subtitle" class="emp-page-sub" style="margin-bottom:16px"></div>
    <div id="saved-grid" class="emp-saved-grid"></div>
  </div>
</div>

<style>
.emp-saved-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
.emp-saved-card {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 20px;
  background: var(--s1);
  border: 1px solid var(--border);
  border-radius: 12px;
  transition: all 0.2s;
  position: relative;
  text-decoration: none;
  color: inherit;
}
.emp-saved-card:hover {
  border-color: var(--accent);
  box-shadow: 0 2px 16px rgba(0,0,0,0.04);
  transform: translateY(-1px);
}
.emp-saved-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
}
.emp-saved-brand { display: flex; gap: 10px; }
.emp-saved-logo {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  object-fit: cover;
}
.emp-saved-logo-init {
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--fh);
  font-size: 14px;
  font-weight: 700;
  background: var(--s2);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--accent);
  flex-shrink: 0;
}
.emp-saved-rm {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  color: var(--muted2);
  background: var(--s2);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
  line-height: 1;
  flex-shrink: 0;
}
.emp-saved-rm:hover { color: var(--danger); border-color: var(--danger); transform: scale(1.05); }
.emp-saved-title {
  font-family: var(--fh);
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
}
.emp-saved-company {
  font-size: 12px;
  color: var(--muted);
}
.emp-saved-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.emp-saved-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.emp-saved-match {
  font-family: var(--fm);
  font-size: 11px;
  color: var(--accent);
}
.emp-saved-salary {
  font-family: var(--fm);
  font-size: 11px;
  color: var(--accent);
  font-weight: 500;
}
.emp-saved-apply {
  display: block;
  text-align: center;
  padding: 9px;
  font-family: var(--fm);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.3px;
  color: var(--accent);
  border: 1px solid rgba(0,229,160,0.2);
  border-radius: 8px;
  transition: all 0.2s;
  margin-top: auto;
}
.emp-saved-apply:hover { background: rgba(0,229,160,0.06); border-color: var(--accent); }
.emp-loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 60px 20px;
  background: var(--s1);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--muted);
  font-size: 13px;
}
.emp-error {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 60px 20px;
  background: var(--s1);
  border: 1px solid var(--border);
  border-radius: 12px;
  text-align: center;
}
.emp-error-icon { font-size: 48px; }
.emp-spinner {
  width: 48px;
  height: 48px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
}
.empty-state .emp-empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
.empty-state .emp-empty-text { font-size: 14px; color: var(--muted); margin-bottom: 16px; }

@media (max-width: 960px) { .emp-saved-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px) { .emp-saved-grid { grid-template-columns: 1fr; } }
</style>

<script src="/static/js/pages/employee/saved.js"></script>

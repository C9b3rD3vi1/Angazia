{{if .Success}}<div class="alert alert-success">{{.Success}}</div>{{end}}
{{if .Error}}<div class="alert alert-error">{{.Error}}</div>{{end}}
<form action="/forgot-password" method="POST" class="card" id="auth-form">
  <div class="card-body">
    <h1 class="page-title">Forgot Password?</h1>
    <p>Enter your email and we'll send you a reset link</p>
    <div class="form-group">
      <label class="form-label" for="email">Email</label>
      <input type="email" name="email" id="email" class="form-input" value="{{.Email}}" required autocomplete="email">
      {{if .Errors.email}}<span class="form-error">{{.Errors.email}}</span>{{end}}
    </div>
    <button type="submit" class="btn-primary btn-block btn-auth-submit">Send Reset Link</button>
  </div>
</form>
<div class="auth-link"><a href="/login">Back to login</a></div>
<style>
  .note-text {
    display: block;
    font-family: var(--fm);
    font-size: 10px;
    color: var(--muted);
    margin-top: 6px;
    text-align: center;
  }
</style>
<script>
(function(){var f=document.getElementById('auth-form');if(f){f.addEventListener('submit',function(){var b=this.querySelector('.btn-auth-submit');if(b){b.disabled=true;b.textContent='Sending\u2026';}});}})();
</script>

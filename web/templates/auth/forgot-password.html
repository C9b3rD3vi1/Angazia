<div id="auth-success" class="alert alert-success" style="display:none"></div>
<div id="auth-error" class="alert alert-error" style="display:none"></div>
<form class="card" id="auth-form">
  <div class="card-body">
    <h1 class="page-title">Forgot Password?</h1>
    <p>Enter your email and we'll send you a reset link</p>
    <div class="form-group">
      <label class="form-label" for="email">Email</label>
      <input type="email" name="email" id="email" class="form-input" value="" required autocomplete="email">
    </div>
    <button type="submit" class="btn-primary btn-block btn-auth-submit">Send Reset Link</button>
  </div>
</form>
<div class="auth-link"><a href="/login">Back to login</a></div>
<style>
  .note-text {
    display: block;
    font-family: var(--fm);
    font-size: 10px;
    color: var(--muted);
    margin-top: 6px;
    text-align: center;
  }
</style>
<script>
(function(){var f=document.getElementById('auth-form'),er=document.getElementById('auth-error'),su=document.getElementById('auth-success'),b;if(f){f.addEventListener('submit',function(ev){ev.preventDefault();b=this.querySelector('.btn-auth-submit');if(b){b.disabled=true;b.textContent='Sending\u2026';}if(er)er.style.display='none';if(su)su.style.display='none';var email=document.getElementById('email').value;if(typeof AngaziaAuth!=='undefined'&&typeof AngaziaAPI!=='undefined'){AngaziaAuth.forgotPassword(email).then(function(){if(b){b.disabled=false;b.textContent='Send Reset Link';}if(su){su.textContent='If an account exists with this email, you will receive a password reset link.';su.style.display='';}}).catch(function(err){if(b){b.disabled=false;b.textContent='Send Reset Link';}var msg=(err.body&&err.body.message)||err.message||'Request failed';if(er){er.textContent=msg;er.style.display='';}else{alert(msg);}});}else{this.submit();}});}})();
</script>

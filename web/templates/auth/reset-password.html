<div id="auth-error" class="alert alert-error" style="display:none"></div>
<form class="card" id="auth-form">
  <div class="card-body">
    <h1 class="page-title">Set New Password</h1>
    <p>Enter your new password</p>
    <input type="hidden" name="token" id="token" value="{{.Token}}">
    <div class="form-group">
      <label class="form-label" for="password">New Password</label>
      <input type="password" name="password" id="password" class="form-input" required autocomplete="new-password">
    </div>
    <div class="form-group">
      <label class="form-label" for="confirm_password">Confirm Password</label>
      <input type="password" name="confirm_password" id="confirm_password" class="form-input" required autocomplete="new-password">
    </div>
    <button type="submit" class="btn-primary btn-block btn-auth-submit">Set New Password</button>
  </div>
</form>
<style>
  .password-req {
    display: block;
    font-family: var(--fm);
    font-size: 10px;
    color: var(--muted);
    margin-top: 6px;
  }
  .password-req.ok { color: var(--accent); }
</style>
<script>
(function(){var f=document.getElementById('auth-form'),e=document.getElementById('auth-error'),b;if(f){f.addEventListener('submit',function(ev){ev.preventDefault();b=this.querySelector('.btn-auth-submit');if(b){b.disabled=true;b.textContent='Setting password\u2026';}if(e)e.style.display='none';var token=document.getElementById('token').value,password=document.getElementById('password').value,confirm=document.getElementById('confirm_password').value;if(password!==confirm){if(b){b.disabled=false;b.textContent='Set New Password';}if(e){e.textContent='Passwords do not match';e.style.display='';}return;}if(typeof AngaziaAuth!=='undefined'&&typeof AngaziaAPI!=='undefined'){AngaziaAuth.resetPassword(token,password).then(function(){window.location.href='/login?reset=1';}).catch(function(err){if(b){b.disabled=false;b.textContent='Set New Password';}var msg=(err.body&&err.body.message)||err.message||'Reset failed';if(e){e.textContent=msg;e.style.display='';}else{alert(msg);}});}else{this.submit();}});}})();
</script>

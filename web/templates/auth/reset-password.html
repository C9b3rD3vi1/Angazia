{{if .Success}}<div class="alert alert-success">{{.Success}}</div>{{end}}
{{if .Error}}<div class="alert alert-error">{{.Error}}</div>{{end}}
<form action="/reset-password" method="POST" class="card" id="auth-form">
  <div class="card-body">
    <h1 class="page-title">Set New Password</h1>
    <p>Enter your new password</p>
    <input type="hidden" name="token" value="{{.Token}}">
    <div class="form-group">
      <label class="form-label" for="password">New Password</label>
      <input type="password" name="password" id="password" class="form-input" required autocomplete="new-password">
      {{if .Errors.password}}<span class="form-error">{{.Errors.password}}</span>{{end}}
    </div>
    <div class="form-group">
      <label class="form-label" for="confirm_password">Confirm Password</label>
      <input type="password" name="confirm_password" id="confirm_password" class="form-input" required autocomplete="new-password">
      {{if .Errors.confirm_password}}<span class="form-error">{{.Errors.confirm_password}}</span>{{end}}
    </div>
    <button type="submit" class="btn-primary btn-block btn-auth-submit">Set New Password</button>
  </div>
</form>
<style>
  .password-req {
    display: block;
    font-family: var(--fm);
    font-size: 10px;
    color: var(--muted);
    margin-top: 6px;
  }
  .password-req.ok { color: var(--accent); }
</style>
<script>
(function(){var f=document.getElementById('auth-form');if(f){f.addEventListener('submit',function(){var b=this.querySelector('.btn-auth-submit');if(b){b.disabled=true;b.textContent='Setting password\u2026';}});}})();
</script>

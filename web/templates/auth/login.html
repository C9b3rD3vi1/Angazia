{{if .Success}}<div class="alert alert-success">{{.Success}}</div>{{end}}
{{if .Error}}<div class="alert alert-error">{{.Error}}</div>{{end}}
<form class="card" id="auth-form">
  <div class="card-body">
    <h1 class="page-title">Welcome Back</h1>
    <p>Sign in to your account</p>
    <div id="auth-error" class="alert alert-error" style="display:none"></div>
    <div class="form-group">
      <label class="form-label" for="email">Email</label>
      <input type="email" name="email" id="email" class="form-input" value="{{.Email}}" required autocomplete="email">
    </div>
    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input type="password" name="password" id="password" class="form-input" required autocomplete="current-password">
    </div>
    <div class="form-extra">
      <label class="checkbox-label">
        <input type="checkbox" name="remember"> Remember me
      </label>
      <a href="/forgot-password" class="forgot-link">Forgot password?</a>
    </div>
    <button type="submit" class="btn-primary btn-block btn-auth-submit">Sign In</button>
  </div>
</form>
<div class="auth-divider"></div>
<a href="/api/v1/github/auth" class="btn-github btn-block">
  <svg class="github-icon" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8"/></svg>
  <span>Continue with GitHub</span>
</a>
<div class="auth-divider"></div>
<div class="auth-link">Don't have an account? <a href="/register">Sign up</a></div>
<style>
  .forgot-link {
    font-family: var(--fm);
    font-size: 11px;
    color: var(--accent);
    text-decoration: none;
  }
  .forgot-link:hover { text-decoration: underline; }
</style>
<script>
(function(){var f=document.getElementById('auth-form'),e=document.getElementById('auth-error'),b;if(f){f.addEventListener('submit',function(ev){ev.preventDefault();b=this.querySelector('.btn-auth-submit');if(b){b.disabled=true;b.textContent='Signing in\u2026';}if(e)e.style.display='none';var email=document.getElementById('email').value,password=document.getElementById('password').value;if(typeof AngaziaAuth!=='undefined'&&typeof AngaziaAPI!=='undefined'){AngaziaAuth.login(email,password).then(function(data){if(data&&data.user&&data.user.role){AngaziaAuth.redirectAfterLogin(data.user.role);}else{window.location.href='/dashboard';}}).catch(function(err){if(b){b.disabled=false;b.textContent='Sign In';}var msg=(err.body&&err.body.message)||err.message||'Login failed';if(e){e.textContent=msg;e.style.display='';}else{alert(msg);}});}else{this.submit();}});}})();
</script>

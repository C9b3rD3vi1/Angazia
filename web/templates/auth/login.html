{{if .Success}}<div class="alert alert-success">{{.Success}}</div>{{end}}
{{if .Error}}<div class="alert alert-error">{{.Error}}</div>{{end}}
<form action="/login" method="POST" class="card" id="auth-form">
  <div class="card-body">
    <h1 class="page-title">Welcome Back</h1>
    <p>Sign in to your account</p>
    <div class="form-group">
      <label class="form-label" for="email">Email</label>
      <input type="email" name="email" id="email" class="form-input" value="{{.Email}}" required autocomplete="email">
      {{if .Errors.email}}<span class="form-error">{{.Errors.email}}</span>{{end}}
    </div>
    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input type="password" name="password" id="password" class="form-input" required autocomplete="current-password">
      {{if .Errors.password}}<span class="form-error">{{.Errors.password}}</span>{{end}}
    </div>
    <div class="form-extra">
      <label class="checkbox-label">
        <input type="checkbox" name="remember"> Remember me
      </label>
      <a href="/forgot-password" class="forgot-link">Forgot password?</a>
    </div>
    <button type="submit" class="btn-primary btn-block btn-auth-submit">Sign In</button>
  </div>
</form>
<div class="auth-divider"></div>
<div class="auth-link">Don't have an account? <a href="/register">Sign up</a></div>
<style>
  .forgot-link {
    font-family: var(--fm);
    font-size: 11px;
    color: var(--accent);
    text-decoration: none;
  }
  .forgot-link:hover { text-decoration: underline; }
</style>
<script>
(function(){var f=document.getElementById('auth-form');if(f){f.addEventListener('submit',function(){var b=this.querySelector('.btn-auth-submit');if(b){b.disabled=true;b.textContent='Signing in\u2026';}});}})();
</script>

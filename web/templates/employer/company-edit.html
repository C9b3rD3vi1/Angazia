{{/* Employer - Edit Company Profile */}}
<div class="emp-dash">
  <div class="emp-page-head">
    <div>
      <h1 class="emp-page-title">Edit Company Profile</h1>
      <p class="emp-page-sub">Update your company information</p>
    </div>
    <a href="/employer/company" class="emp-btn emp-btn-secondary">← Back to Profile</a>
  </div>

  <div id="company-loading" class="emp-loading" style="display: none;">
    <div class="emp-spinner"></div>
    <p>Loading company data...</p>
  </div>

  <div id="company-error" class="emp-error" style="display: none;">
    <div class="emp-error-icon">⚠️</div>
    <h3>Failed to load company data</h3>
    <p id="company-error-msg"></p>
    <button class="emp-btn emp-btn-primary" onclick="location.reload()">Retry</button>
  </div>

  <div id="company-content" style="display: none;">
    <section class="emp-section">
      <form id="form-company-edit" class="emp-form">
        <div class="emp-form-section">
          <h3 class="emp-form-section-title">Company Identity</h3>

          <div class="emp-upload-wrap">
            <div class="emp-company-logo-preview" id="logo-preview">
              <img id="logo-preview-img" src="" style="display: none;">
              <span id="logo-preview-initials" class="emp-company-logo-init">??</span>
            </div>
            <div class="emp-upload-info">
              <button type="button" id="upload-logo-btn" class="emp-btn emp-btn-outline emp-btn-sm">Upload Logo</button>
              <input type="file" id="logo-upload" name="logo" accept="image/*" style="display:none">
              <div class="emp-progress-bar" style="display: none;">
                <div id="upload-progress" class="emp-progress-fill"></div>
              </div>
              <span class="emp-hint">Recommended: 400x400px, PNG or JPG (Max 2MB)</span>
            </div>
          </div>

          <div class="emp-field">
            <label class="emp-label">Company Name <span class="emp-req">*</span></label>
            <input type="text" name="company_name" id="company_name" class="emp-input" placeholder="Your company name" required>
          </div>

          <div class="emp-row-2">
            <div class="emp-field">
              <label class="emp-label">Industry</label>
              <select name="industry" id="industry" class="emp-input">
                <option value="">Select industry</option>
                <option value="technology">Technology</option>
                <option value="fintech">Fintech</option>
                <option value="healthtech">Healthtech</option>
                <option value="edtech">Edtech</option>
                <option value="ecommerce">E-commerce</option>
                <option value="telecom">Telecommunications</option>
                <option value="banking">Banking & Finance</option>
                <option value="consulting">Consulting</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="emp-field">
              <label class="emp-label">Company Size</label>
              <select name="company_size" id="company_size" class="emp-input">
                <option value="">Select size</option>
                <option value="1-10">1-10 employees</option>
                <option value="11-50">11-50 employees</option>
                <option value="51-200">51-200 employees</option>
                <option value="201-500">201-500 employees</option>
                <option value="500+">500+ employees</option>
              </select>
            </div>
          </div>

          <div class="emp-field">
            <label class="emp-label">Location</label>
            <input type="text" name="location" id="location" class="emp-input" placeholder="Nairobi, Kenya">
          </div>
          <div class="emp-row-2">
            <div class="emp-field">
              <label class="emp-label">Phone Number</label>
              <input type="tel" name="phone_number" id="phone_number" class="emp-input" placeholder="+254 700 000 000">
            </div>
            <div class="emp-field">
              <label class="emp-label">Contact Email</label>
              <input type="email" name="email_address" id="email_address" class="emp-input" placeholder="hr@company.com">
            </div>
          </div>
        </div>

        <div class="emp-form-divider"></div>

        <div class="emp-form-section">
          <h3 class="emp-form-section-title">Business Verification</h3>
          <div class="emp-row-2">
            <div class="emp-field">
              <label class="emp-label">Business Registration No.</label>
              <input type="text" name="business_registration_number" id="business_registration_number" class="emp-input" placeholder="e.g. BRN-2024-12345">
            </div>
            <div class="emp-field">
              <label class="emp-label">Tax ID</label>
              <input type="text" name="tax_id" id="tax_id" class="emp-input" placeholder="e.g. KRA PIN A123456789X">
            </div>
          </div>
        </div>

        <div class="emp-form-divider"></div>

        <div class="emp-form-section">
          <h3 class="emp-form-section-title">Online Presence</h3>

          <div class="emp-row-2">
            <div class="emp-field">
              <label class="emp-label">Website</label>
              <input type="url" name="website" id="website" class="emp-input" placeholder="https://example.com">
            </div>
            <div class="emp-field">
              <label class="emp-label">LinkedIn</label>
              <input type="url" name="linkedin" id="linkedin" class="emp-input" placeholder="https://linkedin.com/company/...">
            </div>
          </div>
        </div>

        <div class="emp-form-divider"></div>

        <div class="emp-form-section">
          <h3 class="emp-form-section-title">About</h3>

          <div class="emp-field">
            <label class="emp-label">Company Description</label>
            <textarea name="description" id="description" class="emp-textarea" rows="6" placeholder="Tell candidates about your company mission, culture, and what makes you unique..."></textarea>
          </div>
        </div>

        <div class="emp-form-footer">
          <button type="submit" class="emp-btn emp-btn-primary emp-btn-lg">Save Changes</button>
          <a href="/employer/company" class="emp-btn emp-btn-secondary emp-btn-lg">Cancel</a>
        </div>
      </form>
    </section>
  </div>
</div>

<style>
.emp-page-head {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 8px;
}
.emp-page-title {
  font-family: var(--fh); font-size: 26px; font-weight: 700; letter-spacing: -0.5px; color: var(--text);
}
.emp-page-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }



.emp-loading, .emp-error {
  text-align: center; padding: 60px 20px; background: var(--s1); border: 1px solid var(--border); border-radius: 12px; margin-top: 20px;
}
.emp-spinner {
  width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--purple); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
.emp-error-icon { font-size: 48px; margin-bottom: 16px; }

.emp-section {
  background: var(--s1); border: 1px solid var(--border); border-radius: 12px; padding: 28px; margin-top: 20px;
}
.emp-form { display: flex; flex-direction: column; gap: 0; }
.emp-form-section { display: flex; flex-direction: column; gap: 18px; }
.emp-form-section-title {
  font-family: var(--fm); font-size: 12px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--text); margin-bottom: 4px;
}
.emp-form-divider { height: 1px; background: var(--border); margin: 24px 0; }

.emp-field { display: flex; flex-direction: column; gap: 6px; }
.emp-label { font-family: var(--fm); font-size: 11px; letter-spacing: 0.5px; color: var(--muted); text-transform: uppercase; }
.emp-req { color: var(--danger); }
.emp-hint { font-size: 11px; color: var(--muted2); margin-top: 2px; }

.emp-input {
  padding: 10px 14px; background: var(--s2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 13px; font-family: inherit; outline: none; transition: border-color 0.15s;
}
.emp-input:focus { border-color: var(--purple); }
.emp-textarea {
  padding: 10px 14px; background: var(--s2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 13px; font-family: inherit; resize: vertical; outline: none; line-height: 1.6;
}
.emp-textarea:focus { border-color: var(--purple); }

.emp-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

.emp-upload-wrap {
  display: flex; align-items: center; gap: 20px; padding: 20px; background: var(--s2); border: 1px dashed var(--border); border-radius: 12px;
}
.emp-company-logo-preview {
  width: 80px; height: 80px; border-radius: 50%; overflow: hidden; background: var(--s1); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.emp-company-logo-preview img { width: 100%; height: 100%; object-fit: cover; }
.emp-company-logo-init {
  font-family: var(--fh); font-size: 28px; font-weight: 700; color: var(--purple);
}
.emp-upload-info { display: flex; flex-direction: column; gap: 8px; flex: 1; }
.emp-progress-bar {
  width: 100%; height: 4px; background: var(--s1); border-radius: 2px; overflow: hidden; margin-top: 8px;
}
.emp-progress-fill {
  width: 0%; height: 100%; background: var(--accent); transition: width 0.3s;
}

.emp-form-footer {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--border);
}

@media (max-width: 860px) {
  .emp-page-head { flex-direction: column; align-items: flex-start; }
  .emp-row-2 { grid-template-columns: 1fr; }
  .emp-form-footer { flex-direction: column; align-items: stretch; }
  .emp-upload-wrap { flex-direction: column; text-align: center; }
}
</style>

<script src="/static/js/pages/employer/company.js"></script>

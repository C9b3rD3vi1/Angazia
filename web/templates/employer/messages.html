<div class="emp-page">
  <div class="emp-page-head">
    <div>
      <h1 class="emp-page-title">Messages</h1>
      <p class="emp-page-sub">Conversations with candidates</p>
    </div>
  </div>

  <div class="msg-layout">
    <aside class="msg-sidebar">
      <div class="msg-sidebar-head">
        <button class="msg-new-btn" id="msg-new-btn">+ New Conversation</button>
      </div>
      <div class="msg-search-wrap">
        <input type="text" class="msg-search" id="msg-search" placeholder="Search conversations...">
      </div>
      <div class="msg-conv-list" id="msg-conv-list">
        <div class="msg-loading">Loading conversations...</div>
      </div>
    </aside>

    <main class="msg-main">
      <div class="msg-placeholder" id="msg-placeholder">
        <div class="msg-placeholder-icon">&#x1F4AC;</div>
        <h3>Select a conversation</h3>
        <p>Choose a conversation from the left to start reading messages.</p>
      </div>

      <div class="msg-conv-view" id="msg-conv-view" style="display:none">
        <div class="msg-conv-header" id="msg-conv-header">
          <div class="msg-conv-header-info">
            <strong id="msg-conv-subject"></strong>
            <span class="msg-conv-participants" id="msg-conv-participants"></span>
          </div>
        </div>

        <div class="msg-messages" id="msg-messages"></div>

        <div class="msg-composer" id="msg-composer">
          <textarea class="msg-input" id="msg-input" placeholder="Type your message..." rows="2"></textarea>
          <button class="msg-send-btn" id="msg-send-btn">Send</button>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="emp-modal-overlay" id="msg-new-modal" style="display:none;">
  <div class="emp-modal" style="max-width:480px;">
    <div class="emp-modal-head">
      <h3>New Conversation</h3>
      <button class="emp-modal-close" id="msg-new-close">&times;</button>
    </div>
    <div class="emp-modal-body">
      <div class="emp-field">
        <label class="emp-label">Search Candidate</label>
        <input type="text" class="emp-input" id="msg-new-search" placeholder="Type a candidate name...">
        <div id="msg-new-results" class="msg-new-results"></div>
      </div>
      <div class="emp-field" id="msg-new-subject-field" style="display:none;">
        <label class="emp-label">Subject (optional)</label>
        <input type="text" class="emp-input" id="msg-new-subject" placeholder="e.g. Regarding your application">
      </div>
      <div class="emp-field" id="msg-new-message-field" style="display:none;">
        <label class="emp-label">Message</label>
        <textarea class="emp-textarea" id="msg-new-message" rows="3" placeholder="Type your first message..."></textarea>
      </div>
      <div id="msg-new-error" class="emp-modal-error" style="display:none;">
        <p id="msg-new-error-msg"></p>
      </div>
    </div>
    <div class="emp-modal-foot">
      <button class="emp-btn emp-btn-ghost" id="msg-new-cancel" type="button">Cancel</button>
      <button class="emp-btn emp-btn-primary" id="msg-new-start" disabled type="button">
        <span class="emp-btn-label">Start Conversation</span>
        <span class="emp-btn-spinner" style="display:none;"></span>
      </button>
    </div>
  </div>
</div>

<style>
.emp-page { display: flex; flex-direction: column; gap: 20px; height: 100%; }
.emp-page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.emp-page-title { font-family: var(--fh); font-size: 22px; font-weight: 700; color: var(--text); margin: 0; }
.emp-page-sub { font-size: 12px; color: var(--muted); margin: 4px 0 0; }

.msg-layout { display: flex; gap: 0; flex: 1; min-height: 500px; background: var(--s1); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.msg-sidebar { width: 320px; flex-shrink: 0; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
.msg-sidebar-head { padding: 12px; border-bottom: 1px solid var(--border); }
.msg-new-btn { width: 100%; padding: 9px; font-family: var(--fm); font-size: 12px; font-weight: 600; background: var(--accent); color: var(--bg); border: none; border-radius: var(--radius); cursor: pointer; transition: opacity 0.15s; }
.msg-new-btn:hover { opacity: 0.9; }
.msg-new-results { margin-top: 8px; max-height: 200px; overflow-y: auto; }
.msg-new-result-item { padding: 8px 10px; cursor: pointer; border-radius: 6px; font-size: 13px; color: var(--text); transition: background 0.1s; }
.msg-new-result-item:hover { background: var(--s2); }
.msg-new-result-item.selected { background: rgba(0,229,160,0.1); border: 1px solid var(--accent); }
.msg-search-wrap { padding: 12px; border-bottom: 1px solid var(--border); }
.msg-search { width: 100%; padding: 9px 14px; font-family: var(--fm); font-size: 12px; background: var(--s2); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); outline: none; transition: border-color 0.15s; }
.msg-search:focus { border-color: var(--accent); }
.msg-conv-list { flex: 1; overflow-y: auto; }
.msg-loading { padding: 24px; text-align: center; font-size: 12px; color: var(--muted2); }
.msg-err { padding: 24px; text-align: center; font-size: 12px; color: var(--danger); }
.msg-empty { padding: 24px; text-align: center; font-size: 12px; color: var(--muted2); }
.msg-conv-item { display: flex; gap: 12px; padding: 14px 16px; cursor: pointer; border-bottom: 1px solid var(--border); transition: background 0.1s; }
.msg-conv-item:hover { background: var(--s2); }
.msg-conv-item.active { background: rgba(0,229,160,0.05); border-left: 3px solid var(--accent); }
.msg-conv-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--s2); display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--purple); flex-shrink: 0; font-weight: 600; overflow: hidden; }
.msg-avatar-img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.msg-avatar-initial { font-size: 14px; font-weight: 600; color: var(--purple); }
.msg-conv-body { flex: 1; min-width: 0; }
.msg-conv-name { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 2px; }
.msg-conv-preview { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.msg-conv-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
.msg-conv-time { font-size: 10px; color: var(--muted2); }
.msg-conv-unread { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

.msg-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.msg-placeholder { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--muted2); }
.msg-placeholder-icon { font-size: 48px; }
.msg-placeholder h3 { font-family: var(--fh); font-size: 16px; color: var(--muted); margin: 0; }
.msg-placeholder p { font-size: 12px; color: var(--muted2); margin: 0; }

.msg-conv-view { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.msg-conv-header { padding: 14px 20px; border-bottom: 1px solid var(--border); }
.msg-conv-header-info strong { font-size: 14px; }
.msg-conv-participants { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
.msg-messages { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 8px; }
.msg-bubble { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 13px; line-height: 1.5; }
.msg-bubble.sent { align-self: flex-end; background: var(--accent); color: var(--bg); border-bottom-right-radius: 4px; }
.msg-bubble.received { align-self: flex-start; background: var(--s2); color: var(--text); border-bottom-left-radius: 4px; }
.msg-bubble-time { font-size: 9px; color: inherit; opacity: 0.6; margin-top: 4px; text-align: right; }

.msg-composer { display: flex; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--border); background: var(--s1); }
.msg-input { flex: 1; padding: 10px 14px; font-family: var(--fm); font-size: 13px; border: 1px solid var(--border); border-radius: var(--radius); resize: none; background: var(--s2); color: var(--text); outline: none; transition: border-color 0.15s; }
.msg-input:focus { border-color: var(--accent); }
.msg-send-btn { padding: 10px 20px; font-family: var(--fm); font-size: 12px; font-weight: 600; background: var(--accent); color: var(--bg); border: none; border-radius: var(--radius); cursor: pointer; transition: opacity 0.15s; align-self: flex-end; }
.msg-send-btn:hover { opacity: 0.9; }
.msg-send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.msg-load-more { text-align: center; padding: 8px; }
.msg-load-more button { font-family: var(--fm); font-size: 11px; color: var(--purple); background: none; border: none; cursor: pointer; }
.msg-load-more button:hover { text-decoration: underline; }
.msg-new-day { text-align: center; font-size: 10px; color: var(--muted2); padding: 12px 0; text-transform: uppercase; letter-spacing: 0.5px; }

@media (max-width: 768px) {
  .msg-sidebar { width: 100%; border-right: none; }
  .msg-layout { flex-direction: column; }
  .msg-main { display: none; }
  .msg-main.open { display: flex; }
}
</style>

<script>
(function() {
  var state = {
    conversations: [],
    currentConvId: null,
    messages: [],
    page: 1,
    totalPages: 1,
    loadingMessages: false,
    hasMore: false,
  };

  var convListEl = document.getElementById('msg-conv-list');
  var placeholderEl = document.getElementById('msg-placeholder');
  var convViewEl = document.getElementById('msg-conv-view');
  var convSubjectEl = document.getElementById('msg-conv-subject');
  var convParticipantsEl = document.getElementById('msg-conv-participants');
  var messagesEl = document.getElementById('msg-messages');
  var msgInput = document.getElementById('msg-input');
  var sendBtn = document.getElementById('msg-send-btn');
  var searchInput = document.getElementById('msg-search');
  var newBtn = document.getElementById('msg-new-btn');
  var newModal = document.getElementById('msg-new-modal');
  var newSearch = document.getElementById('msg-new-search');
  var newResults = document.getElementById('msg-new-results');
  var newSubject = document.getElementById('msg-new-subject');
  var newMessage = document.getElementById('msg-new-message');
  var newSubjectField = document.getElementById('msg-new-subject-field');
  var newMessageField = document.getElementById('msg-new-message-field');
  var newStart = document.getElementById('msg-new-start');
  var newCancel = document.getElementById('msg-new-cancel');
  var newClose = document.getElementById('msg-new-close');
  var newError = document.getElementById('msg-new-error');
  var newErrorMsg = document.getElementById('msg-new-error-msg');
  var selectedRecipient = null;
  var searchTimer = null;

  function loadConversations() {
    convListEl.innerHTML = '<div class="msg-loading">Loading conversations...</div>';
    AngaziaAPI.get('/messages').then(function(data) {
      state.conversations = data.conversations || [];
      renderConversations();
    }).catch(function() {
      convListEl.innerHTML = '<div class="msg-err">Failed to load conversations</div>';
    });
  }

  function renderAvatarHTML(user) {
    if (!user) return '?';
    var src = user.avatar_url || '';
    if (src) return '<img src="' + src + '" alt="" class="msg-avatar-img">';
    return '<span class="msg-avatar-initial">' + (user.name ? user.name.charAt(0).toUpperCase() : '?') + '</span>';
  }

  function renderConversations() {
    if (state.conversations.length === 0) {
      convListEl.innerHTML = '<div class="msg-empty">No conversations yet</div>';
      return;
    }
    convListEl.innerHTML = '';
    state.conversations.forEach(function(conv) {
      var other = (conv.participants || []).find(function(p) { return p.user_id !== '{{.User.ID}}'; });
      var otherUser = other && other.user ? other.user : null;
      var name = otherUser ? otherUser.name : 'Unknown';
      var lastMsg = conv.last_message;
      var preview = lastMsg ? lastMsg.content : '';
      var time = lastMsg ? timeAgo(lastMsg.created_at) : '';

      var el = document.createElement('div');
      el.className = 'msg-conv-item' + (conv.id === state.currentConvId ? ' active' : '');
      el.innerHTML = '<div class="msg-conv-avatar">' + renderAvatarHTML(otherUser) + '</div>'
        + '<div class="msg-conv-body">'
        + '<div class="msg-conv-name">' + escapeHtml(name) + '</div>'
        + '<div class="msg-conv-preview">' + escapeHtml(preview) + '</div>'
        + '</div>'
        + '<div class="msg-conv-meta">'
        + '<span class="msg-conv-time">' + time + '</span>'
        + '</div>';
      el.addEventListener('click', function() { openConversation(conv.id); });
      convListEl.appendChild(el);
    });
  }

  function openConversation(convId) {
    state.currentConvId = convId;
    state.messages = [];
    state.page = 1;
    placeholderEl.style.display = 'none';
    convViewEl.style.display = 'flex';
    messagesEl.innerHTML = '<div class="msg-loading">Loading messages...</div>';

    AngaziaAPI.get('/messages/' + convId).then(function(conv) {
      var other = (conv.participants || []).find(function(p) { return p.user_id !== '{{.User.ID}}'; });
      var name = other && other.user ? other.user.name : 'Unknown';
      convSubjectEl.textContent = conv.subject || 'Conversation';
      convParticipantsEl.textContent = 'with ' + name;
      renderConversations();
    });

    loadMessages(convId, true);
  }

  function loadMessages(convId, reset) {
    if (state.loadingMessages) return;
    state.loadingMessages = true;

    AngaziaAPI.get('/messages/' + convId + '/messages', { page: state.page, limit: 50 }).then(function(data) {
      state.loadingMessages = false;
      var msgs = data.messages || [];
      if (reset) {
        state.messages = msgs;
      } else {
        state.messages = msgs.concat(state.messages);
      }
      state.totalPages = data.total_pages || 1;
      state.hasMore = state.page < state.totalPages;
      renderMessages(reset);
      AngaziaAPI.post('/messages/' + convId + '/read', {});
    }).catch(function() {
      state.loadingMessages = false;
      messagesEl.innerHTML = '<div class="msg-err">Failed to load messages</div>';
    });
  }

  function renderMessages(reset) {
    messagesEl.innerHTML = '';
    if (state.messages.length === 0) {
      messagesEl.innerHTML = '<div class="msg-empty" style="padding:40px">No messages yet. Send one below!</div>';
      return;
    }

    if (state.hasMore) {
      var loadMore = document.createElement('div');
      loadMore.className = 'msg-load-more';
      loadMore.innerHTML = '<button>Load earlier messages</button>';
      loadMore.querySelector('button').addEventListener('click', function() {
        state.page++;
        loadMessages(state.currentConvId, false);
      });
      messagesEl.appendChild(loadMore);
    }

    state.messages.forEach(function(msg) {
      var isSent = msg.sender_id === '{{.User.ID}}';
      var bubble = document.createElement('div');
      bubble.className = 'msg-bubble ' + (isSent ? 'sent' : 'received');
      bubble.innerHTML = '<div>' + escapeHtml(msg.content) + '</div>'
        + '<div class="msg-bubble-time">' + timeAgo(msg.created_at) + '</div>';
      messagesEl.appendChild(bubble);
    });

    if (reset) {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
  }

  function sendMessage() {
    var content = msgInput.value.trim();
    if (!content || !state.currentConvId) return;
    sendBtn.disabled = true;

    AngaziaAPI.post('/messages/' + state.currentConvId + '/messages', { content: content }).then(function(msg) {
      msgInput.value = '';
      sendBtn.disabled = false;
      state.messages.push(msg);
      renderMessages(true);
      loadConversations();
    }).catch(function(err) {
      sendBtn.disabled = false;
      if (window.AngaziaApp && AngaziaApp.showToast) AngaziaApp.showToast(err.message || 'Failed to send', 'error');
    });
  }

  function escapeHtml(t) { if (!t) return ''; var d = document.createElement('div'); d.appendChild(document.createTextNode(t)); return d.innerHTML; }
  function timeAgo(t) {
    if (!t) return '';
    var now = new Date(), d = new Date(t);
    var s = Math.floor((now - d) / 1000);
    if (s < 60) return 'just now';
    var m = Math.floor(s / 60); if (m < 60) return m + 'm ago';
    var h = Math.floor(m / 60); if (h < 24) return h + 'h ago';
    var dy = Math.floor(h / 24); if (dy < 7) return dy + 'd ago';
    return d.toLocaleDateString();
  }

  function openNewModal() {
    if (newModal) newModal.style.display = 'flex';
    if (newSearch) { newSearch.value = ''; newSearch.focus(); }
    if (newResults) newResults.innerHTML = '';
    if (newSubject) newSubject.value = '';
    if (newMessage) newMessage.value = '';
    if (newSubjectField) newSubjectField.style.display = 'none';
    if (newMessageField) newMessageField.style.display = 'none';
    if (newStart) { newStart.disabled = true; newStart.querySelector('.emp-btn-label').textContent = 'Start Conversation'; newStart.querySelector('.emp-btn-spinner').style.display = 'none'; }
    if (newError) newError.style.display = 'none';
    selectedRecipient = null;
  }

  function closeNewModal() {
    if (newModal) newModal.style.display = 'none';
  }

  function doCandidateSearch(q) {
    if (!q || q.length < 2) {
      if (newResults) newResults.innerHTML = '';
      return;
    }
    AngaziaAPI.search.candidates({ q: q, limit: 10 }).then(function(data) {
      var candidates = [];
      if (data && data.results) candidates = data.results;
      else if (Array.isArray(data)) candidates = data;
      else if (data && data.data && data.data.results) candidates = data.data.results;
      if (!newResults) return;
      if (candidates.length === 0) {
        newResults.innerHTML = '<div style="padding:8px;font-size:12px;color:var(--muted2);">No candidates found</div>';
        return;
      }
      newResults.innerHTML = '';
      candidates.forEach(function(c) {
        var cd = c.data || c;
        var id = cd.user_id || cd.id;
        var name = cd.full_name || cd.name || 'Unknown';
        var headline = cd.headline || '';
        var el = document.createElement('div');
        el.className = 'msg-new-result-item';
        el.dataset.id = id;
        el.dataset.name = name;
        el.innerHTML = '<strong>' + escapeHtml(name) + '</strong>' + (headline ? '<br><span style="font-size:11px;color:var(--muted);">' + escapeHtml(headline) + '</span>' : '');
        el.addEventListener('click', function() {
          document.querySelectorAll('.msg-new-result-item').forEach(function(i) { i.classList.remove('selected'); });
          el.classList.add('selected');
          selectedRecipient = { id: id, name: name };
          if (newSubjectField) newSubjectField.style.display = '';
          if (newMessageField) newMessageField.style.display = '';
          if (newStart) newStart.disabled = false;
        });
        newResults.appendChild(el);
      });
    }).catch(function() {
      if (newResults) newResults.innerHTML = '<div style="padding:8px;font-size:12px;color:var(--danger);">Search failed</div>';
    });
  }

  function startNewConversation() {
    if (!selectedRecipient) return;
    if (newStart) {
      newStart.disabled = true;
      newStart.querySelector('.emp-btn-label').textContent = 'Creating...';
      newStart.querySelector('.emp-btn-spinner').style.display = 'inline-block';
    }
    if (newError) newError.style.display = 'none';
    var subject = newSubject ? newSubject.value.trim() : '';
    if (!subject) subject = 'Regarding ' + selectedRecipient.name;
    var content = newMessage ? newMessage.value.trim() : '';
    AngaziaAPI.post('/messages', { recipient_id: selectedRecipient.id, subject: subject, content: content })
      .then(function(conv) {
        closeNewModal();
        loadConversations();
        if (conv && conv.id) openConversation(conv.id);
      })
      .catch(function(err) {
        if (newStart) {
          newStart.disabled = false;
          newStart.querySelector('.emp-btn-label').textContent = 'Start Conversation';
          newStart.querySelector('.emp-btn-spinner').style.display = 'none';
        }
        if (newError) { newError.style.display = ''; if (newErrorMsg) newErrorMsg.textContent = err.body && err.body.error ? err.body.error : 'Failed to create conversation'; }
      });
  }

  function initMessages() {
    if (sendBtn) sendBtn.addEventListener('click', sendMessage);
    if (msgInput) {
      msgInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
      });
    }
    if (newBtn) newBtn.addEventListener('click', openNewModal);
    if (newCancel) newCancel.addEventListener('click', closeNewModal);
    if (newClose) newClose.addEventListener('click', closeNewModal);
    if (newModal) newModal.addEventListener('click', function(e) { if (e.target === newModal) closeNewModal(); });
    if (newStart) newStart.addEventListener('click', startNewConversation);
    if (newSearch) {
      newSearch.addEventListener('input', function() {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(function() { doCandidateSearch(newSearch.value.trim()); }, 300);
      });
    }
    if (searchInput) {
      var st;
      searchInput.addEventListener('input', function() {
        clearTimeout(st);
        st = setTimeout(function() {
          var q = searchInput.value.trim().toLowerCase();
          document.querySelectorAll('.msg-conv-item').forEach(function(el) {
            var name = (el.querySelector('.msg-conv-name') || {}).textContent || '';
            el.style.display = name.toLowerCase().includes(q) ? '' : 'none';
          });
        }, 200);
      });
    }
    loadConversations();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initMessages);
  } else {
    initMessages();
  }
})();
</script>

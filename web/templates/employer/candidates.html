{{/* Employer - Candidates */}}
<div class="emp-dash">
  <div class="emp-page-head">
    <div>
      <h1 class="emp-page-title">Candidates</h1>
      <p class="emp-page-sub">Browse and search for top tech talent</p>
    </div>
  </div>

  <div id="candidates-loading" class="emp-loading" style="display: none;">
    <div class="emp-spinner"></div>
    <p>Loading candidates...</p>
  </div>

  <div id="candidates-error" class="emp-error" style="display: none;">
    <div class="emp-error-icon">⚠️</div>
    <h3>Failed to load candidates</h3>
    <p id="candidates-error-msg"></p>
    <button class="emp-btn emp-btn-primary" onclick="location.reload()">Retry</button>
  </div>

  <div id="candidates-content" style="display: none;">
    <div class="emp-search-section">
      <div class="emp-search-group">
        <div class="emp-search">
          <input type="text" id="candidate-search" class="emp-search-input" placeholder="Search by skill, role, or location...">
          <button id="search-btn" class="emp-btn emp-btn-primary">Search</button>
        </div>
      </div>
    </div>

    <section class="emp-section">
      <div class="emp-filter-bar">
        <div class="emp-filter-group">
          <label class="emp-filter-label">Skills</label>
          <select id="skill-filter" class="emp-filter-select">
            <option value="">All Skills</option>
            <option value="go">Go</option>
            <option value="python">Python</option>
            <option value="javascript">JavaScript</option>
            <option value="typescript">TypeScript</option>
            <option value="react">React</option>
            <option value="vue">Vue</option>
            <option value="angular">Angular</option>
            <option value="nodejs">Node.js</option>
            <option value="java">Java</option>
            <option value="php">PHP</option>
            <option value="ruby">Ruby</option>
            <option value="rust">Rust</option>
            <option value="aws">AWS</option>
            <option value="docker">Docker</option>
            <option value="kubernetes">Kubernetes</option>
            <option value="terraform">Terraform</option>
            <option value="devops">DevOps</option>
            <option value="data-science">Data Science</option>
            <option value="ml">Machine Learning</option>
          </select>
        </div>
        <div class="emp-filter-group">
          <label class="emp-filter-label">Location</label>
          <select id="location-filter" class="emp-filter-select">
            <option value="">All Locations</option>
            <option value="nairobi">Nairobi</option>
            <option value="mombasa">Mombasa</option>
            <option value="kisumu">Kisumu</option>
            <option value="nakuru">Nakuru</option>
            <option value="eldoret">Eldoret</option>
            <option value="remote">Remote</option>
          </select>
        </div>
        <div class="emp-filter-group">
          <label class="emp-filter-label">Experience</label>
          <select id="exp-filter" class="emp-filter-select">
            <option value="">Any Level</option>
            <option value="entry">Entry (0-2 years)</option>
            <option value="junior">Junior (1-3 years)</option>
            <option value="mid">Mid-Level (3-5 years)</option>
            <option value="senior">Senior (5-8 years)</option>
            <option value="lead">Lead (8+ years)</option>
          </select>
        </div>
        <div class="emp-filter-group">
          <label class="emp-filter-label">Availability</label>
          <select id="availability-filter" class="emp-filter-select">
            <option value="">All</option>
            <option value="immediate">Immediate</option>
            <option value="2weeks">2 Weeks</option>
            <option value="1month">1 Month</option>
          </select>
        </div>
        <button id="clear-filters" class="emp-btn emp-btn-outline emp-btn-sm">Clear Filters</button>
      </div>
    </section>

    <section class="emp-section">
      <div class="emp-section-head">
        <h2 class="emp-section-title" id="results-title">Candidates</h2>
        <span class="emp-result-hint" id="result-hint">Sorted by match score</span>
      </div>

      <div id="candidates-list" class="emp-candidate-list">
        <!-- Candidates will be rendered here -->
      </div>

      <div id="pagination" class="emp-pagination" style="display: none;">
        <button id="prev-page" class="emp-btn emp-btn-outline emp-btn-sm">← Previous</button>
        <span id="page-info" class="emp-page-info">Page 1 of 1</span>
        <button id="next-page" class="emp-btn emp-btn-outline emp-btn-sm">Next →</button>
      </div>
    </section>
  </div>
</div>

<style>
.emp-page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.emp-page-title {
  font-family: var(--fh);
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: var(--text);
}
.emp-page-sub {
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px;
}

.emp-search-section {
  margin-top: 20px;
}
.emp-search-group { flex-shrink: 0; }
.emp-search {
  display: flex;
  gap: 8px;
}
.emp-search-input {
  flex: 1;
  padding: 12px 16px;
  background: var(--s1);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 13px;
  outline: none;
  transition: border-color 0.15s;
}
.emp-search-input:focus { border-color: var(--purple); }
.emp-search-input::placeholder { color: var(--muted2); }

.emp-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 20px;
  font-family: var(--fm);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.5px;
  border-radius: var(--radius);
  white-space: nowrap;
  transition: all 0.15s;
  cursor: pointer;
  border: none;
}
.emp-btn:active { transform: scale(0.97); }
.emp-btn-primary {
  color: #fff;
  background: linear-gradient(135deg, var(--purple) 0%, #ec4899 100%);
}
.emp-btn-primary:hover { opacity: 0.85; }
.emp-btn-sm { padding: 7px 14px; font-size: 10px; }
.emp-btn-outline {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
}
.emp-btn-outline:hover { border-color: var(--purple); color: var(--purple); }

.emp-loading, .emp-error {
  text-align: center;
  padding: 60px 20px;
  background: var(--s1);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-top: 20px;
}
.emp-spinner {
  width: 40px;
  height: 40px;
  border: 3px solid var(--border);
  border-top-color: var(--purple);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
.emp-error-icon { font-size: 48px; margin-bottom: 16px; }

.emp-section {
  background: var(--s1);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  margin-top: 20px;
}
.emp-section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.emp-section-title {
  font-family: var(--fm);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text);
}
.emp-result-hint {
  font-size: 11px;
  color: var(--muted2);
}

.emp-filter-bar {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  align-items: flex-end;
}
.emp-filter-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1;
  min-width: 140px;
}
.emp-filter-label {
  font-family: var(--fm);
  font-size: 9px;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--muted2);
}
.emp-filter-select {
  padding: 8px 12px;
  background: var(--s2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: 12px;
  cursor: pointer;
  outline: none;
}
.emp-filter-select:focus { border-color: var(--purple); }

/* Candidate Cards */
.emp-candidate-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.emp-candidate-card {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 18px;
  background: var(--s2);
  border: 1px solid var(--border);
  border-radius: 10px;
  transition: all 0.2s;
}
.emp-candidate-card:hover {
  border-color: var(--purple-lt);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(124,58,237,0.1);
}
.emp-candidate-avatar {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--purple), #ec4899);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.emp-candidate-initials {
  font-family: var(--fh);
  font-size: 18px;
  font-weight: 700;
  color: #fff;
}
.emp-candidate-info {
  flex: 1;
  min-width: 0;
}
.emp-candidate-top {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 6px;
}
.emp-candidate-name {
  font-family: var(--fh);
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
}
.emp-candidate-score {
  font-family: var(--fm);
  font-size: 10px;
  padding: 3px 10px;
  background: rgba(0,229,160,0.12);
  color: var(--accent);
  border-radius: 20px;
  letter-spacing: 0.3px;
  font-weight: 500;
}
.emp-candidate-headline {
  display: block;
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 8px;
}
.emp-candidate-tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.emp-tag {
  font-size: 10px;
  padding: 3px 10px;
  background: var(--s1);
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 4px;
}
.emp-candidate-meta {
  display: flex;
  gap: 20px;
  font-size: 11px;
  color: var(--muted2);
}
.emp-candidate-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex-shrink: 0;
}

.emp-pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin-top: 24px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}
.emp-page-info {
  font-size: 12px;
  color: var(--muted);
}

.emp-empty {
  text-align: center;
  padding: 60px 24px;
}
.emp-empty-icon {
  font-size: 48px;
  margin-bottom: 16px;
  opacity: 0.6;
}
.emp-empty-title {
  font-family: var(--fh);
  font-size: 18px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 8px;
}
.emp-empty-desc {
  font-size: 13px;
  color: var(--muted);
  max-width: 400px;
  margin: 0 auto;
  line-height: 1.5;
}

@media (max-width: 860px) {
  .emp-page-head { flex-direction: column; align-items: stretch; }
  .emp-search { flex-direction: column; }
  .emp-search-input { width: 100%; }
  .emp-candidate-card { flex-direction: column; align-items: stretch; text-align: center; }
  .emp-candidate-top { justify-content: center; }
  .emp-candidate-meta { justify-content: center; flex-wrap: wrap; }
  .emp-candidate-actions { flex-direction: row; justify-content: center; }
  .emp-filter-bar { flex-direction: column; }
  .emp-filter-group { min-width: auto; }
}
</style>

<script src="/static/js/pages/employer/candidates.js"></script>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Subject}}</title>
    <style>
        /* Global styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #1f2937;
            background-color: #f3f4f6;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .email-wrapper {
            background-color: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .header {
            background: {{.HeaderColor}};
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        
        .header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
        }
        
        .content {
            padding: 40px 30px;
        }
        
        .footer {
            text-align: center;
            padding: 30px;
            background-color: #f9fafb;
            border-top: 1px solid #e5e7eb;
            font-size: 12px;
            color: #6b7280;
        }
        
        .button {
            display: inline-block;
            padding: 14px 28px;
            background: {{.ButtonColor}};
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            margin: 20px 0;
            transition: background 0.3s;
        }
        
        .button:hover {
            background: {{.ButtonHoverColor}};
        }
        
        .feature-box {
            background: #f9fafb;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            border: 1px solid #e5e7eb;
        }
        
        .warning-box {
            background: #fef3c7;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #f59e0b;
        }
        
        .alert-box {
            background: #fee2e2;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #ef4444;
        }
        
        .success-box {
            background: #d1fae5;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #10b981;
        }
        
        .job-card {
            background: #f9fafb;
            padding: 20px;
            border-radius: 12px;
            margin: 15px 0;
            border: 1px solid #e5e7eb;
            transition: all 0.3s;
        }
        
        .job-card:hover {
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }
        
        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            background: {{.StatusColor}};
            color: white;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
        }
        
        hr {
            margin: 30px 0;
            border: none;
            border-top: 1px solid #e5e7eb;
        }
        
        .text-center {
            text-align: center;
        }
        
        .text-muted {
            color: #6b7280;
            font-size: 14px;
        }
        
        .link {
            color: {{.LinkColor}};
            text-decoration: none;
        }
        
        .link:hover {
            text-decoration: underline;
        }
        
        @media only screen and (max-width: 600px) {
            .container {
                padding: 10px;
            }
            
            .header {
                padding: 30px 20px;
            }
            
            .content {
                padding: 30px 20px;
            }
            
            .button {
                display: block;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="email-wrapper">
            <div class="header">
                <h1>{{.HeaderTitle}}</h1>
            </div>
            
            <div class="content">
                {{.BodyContent}}
            </div>
            
            <div class="footer">
                <p>&copy; {{.Year}} {{.AppName}}. All rights reserved.</p>
                <p style="margin-top: 10px;">
                    <a href="{{.AppURL}}" class="link">{{.AppName}}</a> - Connecting Kenyan tech talent with great opportunities
                </p>
                <p style="margin-top: 10px; font-size: 11px;">
                    This email was sent to {{.Email}}. If you didn't receive this email, please <a href="{{.AppURL}}/contact" class="link">contact us</a>.
                </p>
            </div>
        </div>
    </div>
</body>
</html>

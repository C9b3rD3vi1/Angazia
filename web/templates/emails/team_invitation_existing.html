{{define "team_invitation_existing"}}
<h2>Team Invitation</h2>

<p>You've been invited to join <strong>{{.CompanyName}}</strong> as a <strong>{{.Role}}</strong>.</p>

<div style="text-align: center; margin: 30px 0;">
    <a href="{{.AppURL}}/api/v1/invitations/{{.Token}}/accept" class="button">Accept Invitation</a>
</div>

<div class="warning-box">
    <strong>⚠️ Note:</strong> This invitation expires in 7 days.
</div>

<hr>

<p class="text-muted">If you did not expect this invitation, you can safely ignore this email.</p>
{{end}}

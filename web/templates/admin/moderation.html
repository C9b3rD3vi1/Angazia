{{define "title"}}Moderation{{end}}
{{define "activePage"}}moderation{{end}}

<div class="am-page">
  <div class="am-header">
    <div class="am-header-text">
      <h1 class="am-title">Moderation Queue</h1>
      <p class="am-subtitle">Review and manage reported content</p>
    </div>
    <div class="am-header-actions">
      <label class="am-auto-refresh-label">
        <input type="checkbox" id="am-auto-refresh" checked> Auto-refresh
      </label>
      <button class="am-btn-ghost" id="am-refresh-btn">&#x1F504; Refresh</button>
      <span class="am-count-badge" id="am-count" style="display:none">0</span>
    </div>
  </div>

  <div class="am-tabs">
    <button class="am-tab active" data-status="">All</button>
    <button class="am-tab" data-status="pending">Pending</button>
    <button class="am-tab" data-status="approved">Approved</button>
    <button class="am-tab" data-status="rejected">Rejected</button>
  </div>

  <div class="am-filters">
    <select class="am-select" id="am-entity-type">
      <option value="">All Entity Types</option>
      <option value="job">Job</option>
      <option value="review">Review</option>
      <option value="company">Company</option>
    </select>
  </div>

  <div class="am-loading" id="am-loading">
    <div class="am-spinner"></div>
    <span>Loading moderation items...</span>
  </div>

  <div class="am-error" id="am-error" style="display:none">
    <span class="am-error-icon">&#x26A0;</span>
    <span id="am-error-text">Failed to load items.</span>
    <button class="am-btn am-btn-retry" onclick="amRefresh()">Retry</button>
  </div>

  <div class="am-empty" id="am-empty" style="display:none">
    <span class="am-empty-icon">&#x1F4AD;</span>
    <p class="am-empty-text">No moderation items found.</p>
    <p class="am-empty-hint"></p>
  </div>

  <div class="am-list" id="am-list"></div>

  <div class="am-pagination" id="am-pagination" style="display:none">
    <span class="am-pagi-info" id="am-pagi-info"></span>
    <div class="am-pagi-btns" id="am-pagi-btns"></div>
  </div>
</div>

<div class="am-modal-overlay" id="am-modal" style="display:none">
  <div class="am-modal">
    <div class="am-modal-head">
      <h3 class="am-modal-title">Reject Item</h3>
      <button class="am-modal-close" id="am-modal-close">&times;</button>
    </div>
    <div class="am-modal-body">
      <label class="am-modal-label" for="am-reject-reason">Reason for rejection:</label>
      <textarea class="am-modal-textarea" id="am-reject-reason" rows="4" placeholder="Provide a reason..."></textarea>
    </div>
    <div class="am-modal-actions">
      <button class="am-btn am-btn-cancel" id="am-modal-cancel">Cancel</button>
      <button class="am-btn am-btn-reject" id="am-modal-confirm">Reject</button>
    </div>
  </div>
</div>

<script src="/static/js/pages/admin/moderation.js"></script>

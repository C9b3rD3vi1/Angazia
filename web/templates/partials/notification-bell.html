{{/* Notification Bell Component */}}
{{define "partials/notification-bell"}}
<div class="notif-bell-container" id="notification-bell-container">
  <button class="notif-bell-btn" id="notification-bell" aria-label="Notifications">
    <svg class="notif-bell-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
    </svg>
    {{if .UnreadCount}}
      {{if gt .UnreadCount 0}}
        <span class="notif-badge">{{.UnreadCount}}</span>
      {{end}}
    {{end}}
  </button>
  
  <div class="notif-dropdown" id="notif-dropdown">
    <div class="notif-dropdown-header">
      <span class="notif-dropdown-title">Notifications</span>
      <button class="notif-dropdown-settings" id="notif-settings-btn">⚙️</button>
    </div>
    <div class="notif-dropdown-list" id="notif-dropdown-list">
      <div class="notif-loading-small">Loading...</div>
    </div>
    <div class="notif-dropdown-footer">
      <a href="/notifications" class="notif-view-all">View All Notifications</a>
    </div>
  </div>
</div>

<style>
.notif-bell-container {
  position: relative;
  display: inline-block;
}

.notif-bell-btn {
  position: relative;
  background: none;
  border: none;
  padding: 8px;
  cursor: pointer;
  border-radius: 8px;
  transition: background 0.2s;
  color: var(--muted);
}

.notif-bell-btn:hover {
  background: var(--s2);
  color: var(--text);
}

.notif-badge {
  position: absolute;
  top: 0;
  right: 0;
  background: #ff4f4f;
  color: white;
  font-family: var(--fm);
  font-size: 9px;
  font-weight: 600;
  padding: 2px 5px;
  border-radius: 10px;
  min-width: 16px;
  text-align: center;
  line-height: 1;
}

.notif-dropdown-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}

.notif-dropdown-title {
  font-family: var(--fm);
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text);
}

.notif-dropdown-settings {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 14px;
  padding: 4px;
}

.notif-dropdown-list {
  max-height: 400px;
  overflow-y: auto;
}

.notif-dropdown-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.1s;
  text-decoration: none;
  color: inherit;
}

.notif-dropdown-item:hover {
  background: var(--s2);
}

.notif-dropdown-item.unread {
  background: rgba(0,229,160,0.03);
  border-left: 3px solid var(--accent);
}

.notif-dropdown-icon {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--s2);
  border-radius: 8px;
  font-size: 14px;
  flex-shrink: 0;
}

.notif-dropdown-content {
  flex: 1;
  min-width: 0;
}

.notif-dropdown-title-text {
  font-size: 12px;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 2px;
}

.notif-dropdown-time {
  font-family: var(--fm);
  font-size: 9px;
  color: var(--muted2);
}

.notif-loading-small {
  padding: 20px;
  text-align: center;
  font-size: 11px;
  color: var(--muted);
}

.notif-dropdown-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  text-align: center;
}

.notif-view-all {
  font-family: var(--fm);
  font-size: 10px;
  color: var(--accent);
  text-decoration: none;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.notif-view-all:hover {
  text-decoration: underline;
}

@media (max-width: 640px) {
  .notif-dropdown {
    width: 100vw;
    right: -50px;
  }
}
</style>

<script>
(function() {
  let bellBtn = document.getElementById('notification-bell');
  let dropdown = document.getElementById('notif-dropdown');
  let dropdownList = document.getElementById('notif-dropdown-list');
  let isOpen = false;

  function loadRecentNotifications() {
    if (!dropdownList) return;
    dropdownList.innerHTML = '<div class="notif-loading-small">Loading...</div>';
    
    // Get recent unread notifications
    (window.AngaziaNotifications?.fetchNotifications({ limit: 5, unread_only: true }) || Promise.resolve([]))
      .then(function(notifications) {
        let items = notifications.notifications || notifications.data || notifications || [];
        
        if (!items || items.length === 0) {
          dropdownList.innerHTML = '<div class="notif-loading-small">No new notifications</div>';
          return;
        }
        
        dropdownList.innerHTML = '';
        items.forEach(function(n) {
          let item = document.createElement('div');
          item.className = 'notif-dropdown-item' + (n.is_read ? '' : ' unread');
          
          let iconMap = {
            application: '💼',
            interview: '📅',
            message: '💬',
            alert: '🔔',
            system: '⚙️',
            marketing: '📣',
          };
          let icon = iconMap[n.type] || '🔔';
          
          item.innerHTML = `
            <div class="notif-dropdown-icon">${icon}</div>
            <div class="notif-dropdown-content">
              <div class="notif-dropdown-title-text">${escapeHtml(n.title)}</div>
              <div class="notif-dropdown-time">${timeAgo(n.created_at)}</div>
            </div>
          `;
          
          if (n.action_url) {
            item.addEventListener('click', function(e) {
              if (!n.is_read && window.AngaziaNotifications) {
                window.AngaziaNotifications.markAsRead(n.id);
              }
              window.location.href = n.action_url;
            });
          }
          
          dropdownList.appendChild(item);
        });
      })
      .catch(function(err) {
        console.error('Failed to load notifications:', err);
        dropdownList.innerHTML = '<div class="notif-loading-small">Failed to load</div>';
      });
  }

  if (bellBtn) {
    bellBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      isOpen = !isOpen;
      if (dropdown) {
        dropdown.classList.toggle('open', isOpen);
        if (isOpen) {
          loadRecentNotifications();
        }
      }
    });
  }

  document.addEventListener('click', function(e) {
    if (dropdown && !dropdown.contains(e.target) && !bellBtn?.contains(e.target)) {
      dropdown.classList.remove('open');
      isOpen = false;
    }
  });

  function escapeHtml(t) { if (!t) return ''; var d = document.createElement('div'); d.appendChild(document.createTextNode(t)); return d.innerHTML; }
  
  function timeAgo(t) {
    if (!t) return '';
    var now = new Date(), d = new Date(t);
    var s = Math.floor((now - d) / 1000);
    if (s < 60) return 'just now';
    var m = Math.floor(s / 60); if (m < 60) return m + 'm ago';
    var h = Math.floor(m / 60); if (h < 24) return h + 'h ago';
    var dy = Math.floor(h / 24); if (dy < 7) return dy + 'd ago';
    return d.toLocaleDateString();
  }
})();
</script>
{{end}}
